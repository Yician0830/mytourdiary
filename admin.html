<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>_CHEMERA_後台</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Fredoka:wght@300..700&family=Zen+Maru+Gothic&display=swap" rel="stylesheet"><style>

  :root{
    --paper:#f4f2ec; --paper-2:#ece8de; --ink:#15130f; --ink-dim:#56503f; --ink-faint:#96907d;
    --line:rgba(21,19,15,0.14); --line-strong:rgba(21,19,15,0.3);
    --press:#cc2036; --lcd:#e8850f; --ok:#2e7d4f;
    --display:'Fredoka','Zen Maru Gothic',serif;
    --sans:'Fredoka','Zen Maru Gothic',-apple-system,sans-serif;
    --mono:'Fredoka','Zen Maru Gothic',monospace;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  body{
    background:var(--paper); color:var(--ink); font-family:var(--sans);
    line-height:1.6; min-height:100vh;
  }
  .wrap{ max-width:960px; margin:0 auto; padding:40px 24px 80px; }
  h1{ font-family:var(--display); font-weight:900; font-size:clamp(24px,4vw,30px); letter-spacing:0.02em; }
  h1 span{ color:var(--press); }
  .tag{ font-family:var(--mono); font-size:11px; letter-spacing:0.08em; color:var(--ink-faint); text-transform:uppercase; margin-bottom:8px; }

  /* ===== LOGIN ===== */
  #login-screen{
    min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;
  }
  .login-card{
    width:100%; max-width:360px; background:#fff; border:1px solid var(--line);
    padding:40px 32px; text-align:center;
  }
  .login-card h1{ margin-bottom:6px; font-size:clamp(16px,3vw,26px); white-space:nowrap; }
  .login-card p{ font-size:13px; color:var(--ink-dim); margin-bottom:28px; }
  .field{ text-align:left; margin-bottom:16px; position:relative; }
  .autocomplete-list{
    position:absolute; top:100%; left:0; right:0; z-index:50;
    background:#fff; border:1px solid var(--line-strong); border-top:none;
    max-height:160px; overflow-y:auto; display:none;
  }
  .autocomplete-list.show{ display:block; }
  .autocomplete-list button{
    display:block; width:100%; text-align:left; background:none; border:none;
    padding:9px 12px; font-family:var(--sans); font-size:13px; color:var(--ink); cursor:pointer;
  }
  .autocomplete-list button:hover{ background:var(--paper-2); }
  .field label{ display:block; font-family:var(--mono); font-size:11px; letter-spacing:0.05em; color:var(--ink-dim); margin-bottom:6px; text-transform:uppercase; }
  .field input, .field select{
    width:100%; padding:11px 12px; border:1px solid var(--line-strong); background:var(--paper);
    font-family:var(--sans); font-size:14px; color:var(--ink);
  }
  .field input:focus, .field select:focus{ outline:none; border-color:var(--press); }
  button{
    font-family:var(--mono); font-size:12px; letter-spacing:0.08em; text-transform:uppercase;
    background:var(--ink); color:var(--paper); border:none; padding:13px 20px; cursor:pointer;
    transition:background .2s;
  }
  button:hover{ background:var(--press); }
  button:disabled{ opacity:0.5; cursor:not-allowed; }
  .btn-block{ width:100%; }
  .btn-ghost{ background:transparent; color:var(--ink-dim); border:1px solid var(--line-strong); }
  .btn-ghost:hover{ background:var(--paper-2); color:var(--ink); }
  .msg{ font-family:var(--mono); font-size:12px; margin-top:14px; min-height:16px; }
  .msg.err{ color:var(--press); }
  .msg.ok{ color:var(--ok); }

  /* ===== ADMIN PANEL ===== */
  #panel{ display:none; }
  .topbar{
    display:flex; justify-content:space-between; align-items:center;
    padding-bottom:20px; margin-bottom:30px; border-bottom:1px solid var(--line);
  }
  .topbar .who{ font-family:var(--mono); font-size:12px; color:var(--ink-dim); }

  .card{ background:#fff; border:1px solid var(--line); padding:28px; margin-bottom:28px; }
  .card h2{ font-family:var(--display); font-weight:900; font-size:24px; margin-bottom:18px; letter-spacing:0.02em; }

  .upload-grid{ display:grid; grid-template-columns:1fr 1fr; gap:16px; }
  @media (max-width:600px){ .upload-grid{ grid-template-columns:1fr; } }
  .upload-grid .field.full{ grid-column:1/-1; }

  .drop{
    grid-column:1/-1; border:2px dashed var(--line-strong); padding:28px; text-align:center;
    font-family:var(--mono); font-size:12px; color:var(--ink-dim); cursor:pointer; transition:border-color .2s, background .2s;
  }
  .drop.drag{ border-color:var(--press); background:var(--paper-2); }
  .drop input{ display:none; }
  .preview-list{ display:flex; flex-wrap:wrap; gap:8px; margin-top:12px; }
  .preview-list img{ width:64px; height:64px; object-fit:cover; border:1px solid var(--line); }

  .progress{ font-family:var(--mono); font-size:12px; color:var(--ink-dim); margin-top:14px; }

  /* ===== PHOTO LIST ===== */
  .filter-row{ display:flex; gap:8px; margin-bottom:18px; flex-wrap:wrap; }
  .filter-row button{ background:var(--paper-2); color:var(--ink-dim); }
  .filter-row button.active{ background:var(--ink); color:var(--paper); }

  .photo-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(160px,1fr)); gap:14px; }
  .photo-item{ border:1px solid var(--line); background:var(--paper-2); overflow:hidden; display:flex; flex-direction:column; height:100%; }
  .photo-item .thumb{ aspect-ratio:4/5; overflow:hidden; }
  .photo-item .thumb img{ width:100%; height:100%; object-fit:cover; display:block; }
  .photo-item .info{ padding:10px 12px; flex:1; }
  .photo-item .info .t{ font-size:13px; font-weight:500; margin-bottom:2px; }
  .photo-item .info .m{ font-family:var(--mono); font-size:10px; color:var(--ink-faint); }
  .photo-item .info .cat{ display:inline-block; font-family:var(--mono); font-size:10px; color:var(--press); margin-bottom:6px; text-transform:uppercase; letter-spacing:0.05em; }
  .photo-item .del{
    width:100%; background:none; color:var(--press); border-top:1px solid var(--line);
    font-family:var(--mono); font-size:11px; padding:8px; letter-spacing:0.05em;
  }
  .photo-item .del:hover{ background:var(--press); color:#fff; }
  .empty{ font-family:var(--mono); font-size:12px; color:var(--ink-faint); padding:30px 0; text-align:center; }

    a.view-site{ font-family:var(--mono); font-size:11px; color:var(--ink-dim); letter-spacing:0.05em; }
  a.view-site:hover{ color:var(--press); }

  /* ===== EDIT MODAL ===== */
  .btn-row{ display:flex; }
  .btn-row button{
    flex:1; background:none; border-top:1px solid var(--line);
    font-family:var(--mono); font-size:11px; padding:8px; letter-spacing:0.05em;
  }
  .btn-row .edit{ color:var(--ink-dim); border-right:1px solid var(--line); }
  .btn-row .edit:hover{ background:var(--ink); color:#fff; }
  .btn-row .del{ color:var(--press); width:auto; }
  .btn-row .del:hover{ background:var(--press); color:#fff; }

  .modal-overlay{
    position:fixed; inset:0; background:rgba(21,19,15,0.55);
    display:none; align-items:center; justify-content:center; padding:20px; z-index:300;
  }
  .modal-overlay.open{ display:flex; }
  .modal-card{
    width:100%; max-width:420px; background:#fff; border:1px solid var(--line);
    padding:28px; max-height:90vh; overflow-y:auto;
  }
  .modal-card h2{ font-family:var(--display); font-weight:900; font-size:22px; margin-bottom:18px; }
  .modal-actions{ display:flex; gap:10px; margin-top:20px; }
  .modal-actions button{ flex:1; }
</style>
</head>
<body>

<!-- ===== 登入畫面 ===== -->
<div id="login-screen">
  <div class="login-card">
    <div class="tag">Admin Only</div>
    <h1>_CHEMERA_</h1>
    <p>僅限管理員登入,用來上傳與管理作品集照片</p>
    <div class="field">
      <label>Email</label>
      <input type="email" id="login-email" autocomplete="username">
    </div>
    <div class="field">
      <label>密碼</label>
      <input type="password" id="login-password" autocomplete="current-password">
    </div>
    <button class="btn-block" id="login-btn">登入</button>
    <div class="msg err" id="login-msg"></div>
  </div>
</div>

<!-- ===== 管理後台 ===== -->
<div id="panel">
  <div class="wrap">
    <div class="topbar">
      <h1 style="font-size:24px;">_CHEMERA_</h1>
      <div style="text-align:right;">
        <div class="who" id="who"></div>
        <div style="margin-top:8px; display:flex; gap:12px; justify-content:flex-end;">
          <a class="view-site" href="index.html" target="_blank">查看公開頁面 ↗</a>
          <button class="btn-ghost" id="logout-btn" style="padding:6px 14px;">登出</button>
        </div>
      </div>
    </div>

    <!-- 上傳表單 -->
    <div class="card">
      <h2>上傳新照片</h2>
      <div class="upload-grid">
        <div class="drop" id="drop">
          點擊或拖曳照片到這裡上傳(可一次選多張)
          <input type="file" id="file-input" accept="image/*" multiple>
          <div class="preview-list" id="preview-list"></div>
        </div>
        <div class="field">
          <label>分類</label>
          <select id="f-category">
            <option value="stage">舞台焦點 On Stage</option>
            <option value="airport">飛行日記 Candid</option>
            <option value="fanmeet">近距離 Face to Face</option>
            <option value="fancam">直拍精選 Fancam</option>
          </select>
        </div>
        <div class="field">
        <label>日期時間(顯示在照片右下角)</label>
        <input type="text" id="f-datetime" placeholder="例如：'24.08.17 19:42">
           </div>
        <div class="field">
          <label>標題</label>
          <input type="text" id="f-title" placeholder="例如：主舞台 · 開場曲">
        </div>
        <div class="field" id="f-song-field" style="display:none;">
          <label>曲目名稱</label>
          <input type="text" id="f-song" placeholder="例如：Vitamin G">
        </div>
        <div class="field">
          <label>地點</label>
          <input type="text" id="f-venue" placeholder="例如：高雄巨蛋">
           </div>
      <div class="field">
        <label>拍攝設備</label>
        <input type="text" id="f-equipment" placeholder="例如：Canon R6 + RF 100-500mm">
      </div>
      <div class="field">
        <label>座位</label>
        <input type="text" id="f-seat" placeholder="例如：3樓 A區 12排">
          </div>
      <div class="field">
        <label>影片連結(直拍才需要填)</label>
        <input type="text" id="f-link" placeholder="例如：https://youtube.com/...">
        </div>
        <div class="field full">
          <label>藝人</label>
          <input type="text" id="f-artist" list="artist-datalist" placeholder="輸入或從清單選擇藝人" autocomplete="off">
        <div class="autocomplete-list" id="f-artist-list"></div>
        </div>
        <div class="field full">
          <label>標籤(用逗號分隔，例如：首爾, 簽售服裝, 安可舞台)</label>
          <input type="text" id="f-tags" placeholder="例如：首爾, 簽售服裝, 安可舞台">
        </div>
        <div class="field full">
          <button class="btn-block" id="upload-btn">上傳照片</button>
          <div class="progress" id="upload-progress"></div>
        </div>
      </div>
    </div>

    <!-- 照片管理 -->
    <div class="card">
      <h2>已上傳的照片</h2>
      <div class="filter-row" id="filter-row">
        <button data-cat="all" class="active">全部</button>
        <button data-cat="stage">舞台</button>
        <button data-cat="airport">機場</button>
        <button data-cat="fanmeet">見面會</button>
        <button data-cat="fancam">直拍</button>
      </div>
      <div class="photo-grid" id="photo-grid"></div>
      <div class="empty" id="empty-note" style="display:none;">目前這個分類還沒有照片</div>
    </div>
  </div>
</div>
<!-- ===== 編輯照片彈窗 ===== -->
<div class="modal-overlay" id="edit-overlay">
  <div class="modal-card">
    <h2>編輯照片資訊</h2>
    <div class="field">
      <label>分類</label>
      <select id="e-category">
        <option value="stage">舞台之上 On Stage</option>
        <option value="airport">直擊現場 Candid</option>
        <option value="fanmeet">近距離 Face to Face</option>
        <option value="fancam">直拍精選 Fancam</option>
      </select>
    </div>
    <div class="field">
      <label>日期時間</label>
      <input type="text" id="e-datetime">
    </div>
    <div class="field">
      <label>標題</label>
      <input type="text" id="e-title">
    </div>
    <div class="field" id="e-song-field" style="display:none;">
      <label>曲目名稱</label>
      <input type="text" id="e-song">
    </div>
    <div class="field">
      <label>地點</label>
      <input type="text" id="e-venue">
    </div>
    <div class="field">
      <label>拍攝設備</label>
      <input type="text" id="e-equipment">
    </div>
    <div class="field">
      <label>座位</label>
      <input type="text" id="e-seat">
       </div>
    <div class="field">
      <label>影片連結</label>
      <input type="text" id="e-link">
    </div>
    <div class="field">
      <label>藝人</label>
      <input type="text" id="e-artist" list="artist-datalist" placeholder="輸入或從清單選擇藝人" autocomplete="off">
      <div class="autocomplete-list" id="e-artist-list"></div>
    </div>
    <div class="field">
      <label>標籤(用逗號分隔)</label>
      <input type="text" id="e-tags">
    </div>
    <div class="modal-actions">
      <button class="btn-ghost" id="edit-cancel">取消</button>
      <button id="edit-save">儲存修改</button>
    </div>
  </div>
</div>
<datalist id="artist-datalist"></datalist>
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
  import {
    getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut
  } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
  import {
        getFirestore, collection, addDoc, deleteDoc, updateDoc, doc, onSnapshot, query, orderBy, serverTimestamp
  } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

  // ===== 你的專案設定（已填好） =====
  const firebaseConfig = {
    apiKey: "AIzaSyD-vJuZN5Omm8xjQ5aJETfOVJ9DClpj05w",
    authDomain: "my-tour-diary.firebaseapp.com",
    projectId: "my-tour-diary",
    storageBucket: "my-tour-diary.firebasestorage.app",
    messagingSenderId: "895305453867",
    appId: "1:895305453867:web:1dd4c7c12358d7321b356e",
    measurementId: "G-DBP2WDNQJD"
  };
  const CLOUDINARY_CLOUD_NAME = "nmldtpzv";
  const CLOUDINARY_UPLOAD_PRESET = "xm1rfejx";
  // ================================

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  const loginScreen = document.getElementById('login-screen');
  const panel = document.getElementById('panel');
  const loginBtn = document.getElementById('login-btn');
  const loginMsg = document.getElementById('login-msg');
  const logoutBtn = document.getElementById('logout-btn');
  const whoEl = document.getElementById('who');

  loginBtn.addEventListener('click', async () => {
    loginMsg.textContent = '';
    const email = document.getElementById('login-email').value.trim();
    const password = document.getElementById('login-password').value;
    if(!email || !password){ loginMsg.textContent = '請輸入 Email 和密碼'; return; }
    loginBtn.disabled = true; loginBtn.textContent = '登入中…';
    try{
      await signInWithEmailAndPassword(auth, email, password);
    }catch(err){
      loginMsg.textContent = '登入失敗,請確認帳號密碼是否正確';
      console.error(err);
    }finally{
      loginBtn.disabled = false; loginBtn.textContent = '登入';
    }
  });

  logoutBtn.addEventListener('click', () => signOut(auth));

  onAuthStateChanged(auth, (user) => {
    if(user){
      loginScreen.style.display = 'none';
      panel.style.display = 'block';
      whoEl.textContent = '登入身分：' + user.email;
      startPhotoSync();
    } else {
      loginScreen.style.display = 'flex';
      panel.style.display = 'none';
    }
  });

  // ===== 上傳照片 =====
  const dropEl = document.getElementById('drop');
  const fileInput = document.getElementById('file-input');
  const previewList = document.getElementById('preview-list');
  const uploadBtn = document.getElementById('upload-btn');
  const uploadProgress = document.getElementById('upload-progress');

  let selectedFiles = [];

  // ===== 曲目名稱欄位：只有分類選「直拍精選」時才顯示 =====
  const fCategoryEl = document.getElementById('f-category');
  const fSongField = document.getElementById('f-song-field');
  function toggleFSongField(){
    fSongField.style.display = fCategoryEl.value === 'fancam' ? '' : 'none';
  }
  fCategoryEl.addEventListener('change', toggleFSongField);
  toggleFSongField();

  const eCategoryField = document.getElementById('e-category');
  const eSongField = document.getElementById('e-song-field');
  function toggleESongField(){
    eSongField.style.display = eCategoryField.value === 'fancam' ? '' : 'none';
  }
  eCategoryField.addEventListener('change', toggleESongField);

  dropEl.addEventListener('click', () => fileInput.click());
  dropEl.addEventListener('dragover', (e) => { e.preventDefault(); dropEl.classList.add('drag'); });
  dropEl.addEventListener('dragleave', () => dropEl.classList.remove('drag'));
  dropEl.addEventListener('drop', (e) => {
    e.preventDefault(); dropEl.classList.remove('drag');
    handleFiles(e.dataTransfer.files);
  });
  fileInput.addEventListener('change', () => handleFiles(fileInput.files));

  function handleFiles(fileList){
    selectedFiles = Array.from(fileList).filter(f => f.type.startsWith('image/'));
    previewList.innerHTML = '';
    selectedFiles.forEach(f => {
      const img = document.createElement('img');
      img.src = URL.createObjectURL(f);
      previewList.appendChild(img);
    });
  }

  uploadBtn.addEventListener('click', async () => {
    if(selectedFiles.length === 0){ uploadProgress.textContent = '請先選擇至少一張照片'; return; }
    const category = document.getElementById('f-category').value;
    const artist = document.getElementById('f-artist').value.trim();
    const datetime = document.getElementById('f-datetime').value.trim();
    const title = document.getElementById('f-title').value.trim();
    const song = document.getElementById('f-song').value.trim();
    const venue = document.getElementById('f-venue').value.trim();
    const equipment = document.getElementById('f-equipment').value.trim();
    const seat = document.getElementById('f-seat').value.trim();
    const link = document.getElementById('f-link').value.trim();
    const tags = parseTagsInput(document.getElementById('f-tags').value);

    uploadBtn.disabled = true;
    let done = 0;
    for(const file of selectedFiles){
      uploadProgress.textContent = `處理中… (${done + 1}/${selectedFiles.length})`;
      try{
        const uploadFile = await compressImageIfNeeded(file);
        uploadProgress.textContent = `上傳中… (${done + 1}/${selectedFiles.length})`;
        const url = await uploadToCloudinary(uploadFile);
        await addDoc(collection(db, 'photos'), {
          url, category, artist, datetime, title, song, venue, equipment, seat, link, tags,
          createdAt: serverTimestamp()
        });
        done++;
      }catch(err){
        console.error(err);
        uploadProgress.textContent = '上傳失敗：' + (err.message || 'Cloudinary 設定可能不正確');
        uploadBtn.disabled = false;
        return;
      }
    }
    uploadProgress.textContent = `完成！已上傳 ${done} 張照片`;
    selectedFiles = [];
    previewList.innerHTML = '';
    fileInput.value = '';
    document.getElementById('f-title').value = '';
     document.getElementById('f-artist').value = '';
     document.getElementById('f-song').value = '';
     document.getElementById('f-venue').value = '';
    document.getElementById('f-equipment').value = '';
    document.getElementById('f-seat').value = '';
    document.getElementById('f-link').value = '';
    document.getElementById('f-datetime').value = '';
    document.getElementById('f-tags').value = '';
    uploadBtn.disabled = false;
  });

  // 把「首爾, #簽售服裝，安可舞台」這種輸入字串轉成乾淨的標籤陣列（去掉多餘的#、空白、重複、支援中英文逗號）
  function parseTagsInput(raw){
    if(!raw) return [];
    return Array.from(new Set(
      raw.split(/[,，]/)
        .map(t => t.trim().replace(/^#+/, ''))
        .filter(Boolean)
    ));
  }

  // Cloudinary 免費方案單檔上限 10MB，這裡抓 9.5MB 當安全門檻
  const MAX_UPLOAD_BYTES = 9.5 * 1024 * 1024;

  // 如果照片超過門檻，用 canvas 自動等比例縮小 + 壓縮畫質，直到符合大小限制
  async function compressImageIfNeeded(file){
    if(file.size <= MAX_UPLOAD_BYTES) return file;

    const imgBitmap = await loadImage(file);
    let { width, height } = imgBitmap;
    let quality = 0.9;
    let scale = 1;
    let blob = file;

    // 先嘗試單純降畫質，最多嘗試 6 次；若還是太大，再逐步縮小尺寸
    for(let attempt = 0; attempt < 10; attempt++){
      const canvas = document.createElement('canvas');
      canvas.width = Math.round(width * scale);
      canvas.height = Math.round(height * scale);
      const ctx = canvas.getContext('2d');
      ctx.drawImage(imgBitmap, 0, 0, canvas.width, canvas.height);
      blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/jpeg', quality));

      if(!blob) break;
      if(blob.size <= MAX_UPLOAD_BYTES) break;

      if(quality > 0.5){
        quality -= 0.1;
      } else {
        scale *= 0.85;
      }
    }

    const originalName = file.name.replace(/\.[^.]+$/, '');
    return new File([blob], originalName + '.jpg', { type: 'image/jpeg' });
  }

  function loadImage(file){
    return new Promise((resolve, reject) => {
      const img = new Image();
      img.onload = () => resolve(img);
      img.onerror = reject;
      img.src = URL.createObjectURL(file);
    });
  }

  async function uploadToCloudinary(file){
    const formData = new FormData();
    formData.append('file', file);
    formData.append('upload_preset', CLOUDINARY_UPLOAD_PRESET);
    const res = await fetch(`https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/image/upload`, {
      method: 'POST',
      body: formData
    });
    const data = await res.json();
    if(!res.ok){
      const msg = (data && data.error && data.error.message) ? data.error.message : ('Cloudinary upload failed (HTTP ' + res.status + ')');
      throw new Error(msg);
    }
    return data.secure_url;
  }

  // ===== 照片列表 / 刪除 =====
  const photoGrid = document.getElementById('photo-grid');
  const emptyNote = document.getElementById('empty-note');
  const filterRow = document.getElementById('filter-row');
  let currentFilter = 'all';
  let allPhotos = [];
  let syncStarted = false;

  filterRow.addEventListener('click', (e) => {
    const btn = e.target.closest('button');
    if(!btn) return;
    [...filterRow.children].forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentFilter = btn.dataset.cat;
    renderPhotoList();
  });

  function startPhotoSync(){
    if(syncStarted) return;
    syncStarted = true;
    const q = query(collection(db, 'photos'), orderBy('createdAt', 'desc'));
    onSnapshot(q, (snapshot) => {
      allPhotos = [];
      snapshot.forEach(docSnap => allPhotos.push({ id: docSnap.id, ...docSnap.data() }));
      renderPhotoList();
      renderArtistDatalist();
    });
  }

  // 把出現過的藝人名稱都收進 datalist,輸入欄位就能下拉選擇之前用過的名字
  let knownArtists = [];

  function renderArtistDatalist(){
    const artistDatalist = document.getElementById('artist-datalist');
    knownArtists = Array.from(new Set(allPhotos.map(p => p.artist).filter(Boolean)))
      .sort((a, b) => a.localeCompare(b, 'zh-Hant'));
    artistDatalist.innerHTML = knownArtists.map(a => `<option value="${escapeHTML(a)}">`).join('');
  }

  function setupArtistAutocomplete(inputEl, listEl){
    function renderList(){
      const q = inputEl.value.trim().toLowerCase();
      const matches = knownArtists.filter(a => !q || a.toLowerCase().includes(q));
      if (!matches.length){ listEl.classList.remove('show'); listEl.innerHTML = ''; return; }
      listEl.innerHTML = matches.map(a => `<button type="button">${escapeHTML(a)}</button>`).join('');
      listEl.classList.add('show');
    }
    inputEl.addEventListener('focus', renderList);
    inputEl.addEventListener('input', renderList);
    inputEl.addEventListener('blur', () => setTimeout(() => listEl.classList.remove('show'), 150));
    listEl.addEventListener('click', (e) => {
      const btn = e.target.closest('button');
      if (!btn) return;
      inputEl.value = btn.textContent;
      listEl.classList.remove('show');
    });
  }

  setupArtistAutocomplete(document.getElementById('f-artist'), document.getElementById('f-artist-list'));
  setupArtistAutocomplete(document.getElementById('e-artist'), document.getElementById('e-artist-list'));

  const CAT_LABEL = { stage: '舞台焦點', airport: '飛行日記', fanmeet: '近距離', fancam: '直拍精選' };

  function renderPhotoList(){
    const items = currentFilter === 'all' ? allPhotos : allPhotos.filter(p => p.category === currentFilter);
    photoGrid.innerHTML = '';
    emptyNote.style.display = items.length ? 'none' : 'block';
    items.forEach(p => {
      const el = document.createElement('div');
      el.className = 'photo-item';
      el.innerHTML = `
        <div class="thumb"><img src="${p.url}" loading="lazy"></div>
        <div class="info">
          <div class="cat">${CAT_LABEL[p.category] || p.category}</div>
          <div class="t">${escapeHTML(p.title) || '（未填標題）'}</div>
          ${p.artist ? `<div class="m" style="margin-top:2px;">👤 ${escapeHTML(p.artist)}</div>` : ''}
          <div class="m">${escapeHTML(p.venue) || ''} ${p.datetime ? ' · ' + escapeHTML(p.datetime) : ''}</div>
          ${(p.tags && p.tags.length) ? `<div class="m" style="margin-top:4px; color:var(--press);">${p.tags.map(t => '#' + escapeHTML(t)).join('  ')}</div>` : ''}
        </div>
        <div class="btn-row">
          <button class="edit" data-id="${p.id}">編輯</button>
          <button class="del" data-id="${p.id}">刪除</button>
        </div>
      `;
      photoGrid.appendChild(el);
    });
    photoGrid.querySelectorAll('.del').forEach(btn => {
      btn.addEventListener('click', async () => {
        if(!confirm('確定要刪除這張照片嗎？(僅移除網站上的紀錄,Cloudinary 圖床上的原始檔不會自動刪除)')) return;
        await deleteDoc(doc(db, 'photos', btn.dataset.id));
      });
    });
    photoGrid.querySelectorAll('.edit').forEach(btn => {
      btn.addEventListener('click', () => openEditModal(btn.dataset.id));
    });
  }

    // ===== 編輯照片 =====
  const editOverlay = document.getElementById('edit-overlay');
  const eCategory = document.getElementById('e-category');
  const eArtist = document.getElementById('e-artist');
  const eDatetime = document.getElementById('e-datetime');
  const eTitle = document.getElementById('e-title');
  const eSong = document.getElementById('e-song');
  const eVenue = document.getElementById('e-venue');
  const eEquipment = document.getElementById('e-equipment');
  const eSeat = document.getElementById('e-seat');
    const eLink = document.getElementById('e-link');
  const eTags = document.getElementById('e-tags');
  const editSaveBtn = document.getElementById('edit-save');
  const editCancelBtn = document.getElementById('edit-cancel');
  let editingId = null;

  function openEditModal(id){
    const p = allPhotos.find(x => x.id === id);
    if(!p) return;
    editingId = id;
    eCategory.value = p.category || 'stage';
    eArtist.value = p.artist || '';
    eDatetime.value = p.datetime || '';
    eTitle.value = p.title || '';
    eSong.value = p.song || '';
    eVenue.value = p.venue || '';
    toggleESongField();
    eEquipment.value = p.equipment || '';
    eSeat.value = p.seat || '';
    eLink.value = p.link || '';
    eTags.value = (p.tags || []).join(', ');
    editOverlay.classList.add('open');
  }

  function closeEditModal(){
    editOverlay.classList.remove('open');
    editingId = null;
  }

  editCancelBtn.addEventListener('click', closeEditModal);
  editOverlay.addEventListener('click', (e) => { if(e.target === editOverlay) closeEditModal(); });

  editSaveBtn.addEventListener('click', async () => {
    if(!editingId) return;
    editSaveBtn.disabled = true;
    editSaveBtn.textContent = '儲存中…';
    try{
       await updateDoc(doc(db, 'photos', editingId), {
        category: eCategory.value,
        artist: eArtist.value.trim(),
        datetime: eDatetime.value.trim(),
        title: eTitle.value.trim(),
        song: eSong.value.trim(),
        venue: eVenue.value.trim(),
         equipment: eEquipment.value.trim(),
        seat: eSeat.value.trim(),
        link: eLink.value.trim(),
        tags: parseTagsInput(eTags.value)
      });
      closeEditModal();
    }catch(err){
      console.error(err);
      alert('儲存失敗,請稍後再試一次');
    }finally{
      editSaveBtn.disabled = false;
      editSaveBtn.textContent = '儲存修改';
    }
  });

  function escapeHTML(str){
    return String(str ?? '').replace(/[&<>"']/g, s => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]));
  }
</script>

</body>
</html>
